name: App CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-build-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint styles
        run: npm run lint:styles

      - name: Vercel pull (preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npx vercel link --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"
          npx vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Vercel pull (production)
        if: github.event_name == 'push'
        run: |
          npx vercel link --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Vercel build
        run: npx vercel build --yes --token "$VERCEL_TOKEN"
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

      - name: Vercel deploy (preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: vercel_deploy_preview
        run: |
          url=$(npx vercel deploy --prebuilt --yes --token "$VERCEL_TOKEN" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel_deploy_preview.outputs.url }}';
            if (!url) {
              core.setFailed("Missing preview URL from Vercel deploy.");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployment is ready: ${url}`
            });

      - name: Vercel deploy (production)
        if: github.event_name == 'push'
        run: npx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
